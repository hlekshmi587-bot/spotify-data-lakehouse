name: end_to_end_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S-end-to-end-validation"

validations:
  # Bronze
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: bronze_connector
      data_asset_name: tracks
    expectation_suite_name: bronze_tracks_suite
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: bronze_connector
      data_asset_name: charts
    expectation_suite_name: bronze_charts_suite
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: bronze_connector
      data_asset_name: countries
    expectation_suite_name: bronze_countries_suite
  # Silver
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: silver_connector
      data_asset_name: tracks
    expectation_suite_name: silver_tracks_suite
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: silver_connector
      data_asset_name: charts
    expectation_suite_name: silver_charts_suite
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: silver_connector
      data_asset_name: countries
    expectation_suite_name: silver_countries_suite
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: silver_connector
      data_asset_name: track_genres
    expectation_suite_name: silver_track_genres_suite
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: silver_connector
      data_asset_name: tracks_quarantine
    expectation_suite_name: quarantine_isolation_suite
  # Gold & Marts
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: gold_connector
      data_asset_name: enriched_chart_data
    expectation_suite_name: gold_enriched_charts_suite
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: gold_connector
      data_asset_name: country_analytics
    expectation_suite_name: gold_country_analytics_suite
  - batch_request:
      datasource_name: lakehouse_datasource
      data_connector_name: marts_connector
      data_asset_name: referential_integrity
    expectation_suite_name: referential_integrity_suite

action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
